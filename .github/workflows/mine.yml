name: mine

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes
  workflow_dispatch:
    inputs:
      entry_page_url:
        description: Test only. Page that lists the client entry scripts (default is the public workspace client page)
        type: string
        default: ''
      force:
        description: Re-mine even if the build number is unchanged
        type: boolean
        default: false

concurrency:
  group: mine
  cancel-in-progress: false

permissions:
  contents: write
  issues: write # the health report opens/closes an issue

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # cosmetic: silence git's "initial branch master" hint (checkout runs a bare `git init`) and node's punycode warning from the actions' own runtime
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      NODE_OPTIONS: --disable-warning=DEP0040
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm test
      # Taut (a Slack client mod) looks things up in the client by name. List them so the miner can record how each is defined (build/taut-presence.json).
      - name: Check out Taut (public) to read which names it looks up
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        continue-on-error: true
        with:
          repository: ${{ vars.TAUT_REPO || 'jeremy46231/taut' }}
          persist-credentials: false
          path: taut
      - name: List what Taut looks up
        run: node src/taut-usage.mjs taut --json > taut-watch.json || rm -f taut-watch.json
      - name: Mine
        id: mine
        env:
          SLACK_D_COOKIE: ${{ secrets.SLACK_D_COOKIE }}
          SLACK_CLIENT_URL: ${{ vars.SLACK_CLIENT_URL || 'https://app.slack.com/client/E09V59WQY1E' }}
          ENTRY_PAGE_URL: ${{ inputs.entry_page_url }}
          TAUT_WATCH: taut-watch.json
        run: node src/mine.mjs ${{ inputs.force && '--force' || '' }}
      - name: Upload debug files on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: debug
          path: debug/
          retention-days: 3
          if-no-files-found: ignore
      - name: Commit and tag
        id: commit
        if: steps.mine.outputs.changed == 'true'
        env:
          BUILD: ${{ steps.mine.outputs.build }}
        run: |
          git config user.name "Izie"
          git config user.email "238573415+IzieStratt@users.noreply.github.com"
          git add build state
          if git diff --cached --quiet; then
            echo "build/state unchanged (forced re-mine); nothing to commit"
          else
            git commit -m "build $BUILD" \
              -m "Co-Authored-By: GitHub Actions <automated-tools@izie.top>"
            # other workflows (taut-watch, feed) push to main too: rebase and retry rather than lose the build
            for i in 1 2 3; do
              git push origin HEAD && break
              [ "$i" = 3 ] && { echo "push failed"; exit 1; }
              git pull --rebase origin main
            done
            git tag -f "$BUILD"
            git push --force origin "refs/tags/$BUILD"
          fi

      # ReDocumented, the icons PDF and the changes feed are refreshed once a day by feed.yml (it only reads what is committed here), so a
      # new Slack build no longer means a new commit on personal-site.

      # Last, so the mined data is already committed and pushed. Opens/updates/closes the `mine-health` issue; fails the run once per change.
      - name: Report mine health
        if: always() && steps.mine.outputs.health != ''  # also files the new-source notices
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: node src/health-report.mjs
